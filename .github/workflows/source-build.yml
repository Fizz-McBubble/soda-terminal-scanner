name: Public scanner source build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out public sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select the locked .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.423
      - name: Build scanner, Helper and OCR CLI
        shell: pwsh
        run: ./build.ps1 -ArtifactsRoot (Join-Path $env:RUNNER_TEMP 'soda-source-build')
